<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e3b43"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pokédex Device Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#chassisGrad)" stroke="#fca5a5" stroke-width="1.5"/>
  
  <!-- Corner Screws -->
  <circle cx="8" cy="8" r="1.5" fill="#fecaca" opacity="0.8"/>
  <circle cx="56" cy="8" r="1.5" fill="#fecaca" opacity="0.8"/>
  <circle cx="8" cy="56" r="1.5" fill="#fecaca" opacity="0.8"/>
  <circle cx="56" cy="56" r="1.5" fill="#fecaca" opacity="0.8"/>

  <!-- Top Status Trio LEDs -->
  <circle cx="42" cy="10" r="2.2" fill="#ef4444"/>
  <circle cx="48" cy="10" r="2.2" fill="#f59e0b"/>
  <circle cx="54" cy="10" r="2.2" fill="#10b981"/>

  <!-- Main Biometric Lens Outer Rim -->
  <circle cx="28" cy="34" r="22" fill="#030712" stroke="#475569" stroke-width="2"/>
  <circle cx="28" cy="34" r="19" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2"/>
  
  <!-- Glowing Sensor Lens -->
  <circle cx="28" cy="34" r="16" fill="url(#lensGlow)" filter="url(#softGlow)"/>

  <!-- Lens Glare Highlight -->
  <ellipse cx="23" cy="28" rx="5" ry="2.5" transform="rotate(-30 23 28)" fill="#ffffff" opacity="0.65"/>

  <!-- Sharp Avian Falcon / Bird Silhouette Overlay -->
  <path d="M 18 36 C 21 30, 26 25, 34 22 C 32 26, 31 29, 31 33 C 35 30, 39 29, 43 30 C 39 34, 34 37, 29 42 C 27 45, 23 46, 20 46 C 22 43, 23 40, 21 38 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="33" cy="25" r="1" fill="#0891b2"/>
</svg>
